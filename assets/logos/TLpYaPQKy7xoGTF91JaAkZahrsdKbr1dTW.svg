<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">U5DT Token Logo</title>
  <desc id="desc">A clean logo for the U5DT token contract.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a2f"/>
      <stop offset="100%" stop-color="#0b3d6d"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66d9ff"/>
      <stop offset="100%" stop-color="#8af0d0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="40" fill="url(#background)"/>
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring)" stroke-width="18"/>
  <circle cx="256" cy="256" r="150" fill="#ffffff" fill-opacity="0.04"/>
  <text x="256" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="700" fill="#ffffff" letter-spacing="3">U5DT</text>
</svg>
